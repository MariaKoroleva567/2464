<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр: актуализация учебного плана по программе «В»</title>
<style>
  :root{
    --ink:#132038;--muted:#5b6c88;--line:#dbe3ef;
    --accent:#c2410c;--accent-soft:#fdeee4;
    --ok:#0f8a5f;--ok-soft:#e6f6ef;--bad:#c62828;--bad-soft:#fdecec;
    --warn:#b7791f;--warn-soft:#fdf6e3;
    --paper:linear-gradient(160deg,#fdf8f4 0%,#f7ede5 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#eef3fa;}
  body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);overflow:hidden;}
  #host{position:relative;width:100vw;height:600px;max-height:600px;min-height:220px;overflow:hidden;background:var(--paper);}
  #stage{position:absolute;top:0;left:0;transform-origin:top left;background:var(--paper);
         display:flex;flex-direction:column;padding:11px 17px 9px;overflow:hidden;}

  .h{font-size:22px;line-height:1.18;font-weight:700;}
  .sub{font-size:20px;line-height:1.22;font-weight:600;}
  body,p,li,button,span,div,td,th,label{font-size:18px;line-height:1.28;}

  header{display:flex;align-items:center;gap:11px;flex:0 0 auto;}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;flex:0 0 auto;
        display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
  .hg{flex:1 1 auto;min-width:0;}
  .hg .h{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 12px;}
  .pill b{font-size:20px;color:var(--accent);}
  .pill span{color:var(--muted);}

  .pbar{height:7px;background:#fff;border:1px solid var(--line);border-radius:5px;margin:8px 0 8px;overflow:hidden;flex:0 0 auto;}
  .pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s;}

  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;}
  .card{background:#fff;border:2px solid var(--line);border-radius:13px;padding:10px 14px;
        flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden;}
  .meta{color:var(--muted);display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 9px;font-weight:600;}
  .ask{font-size:20px;font-weight:600;flex:0 0 auto;}

  /* паспорт плана */
  .pass{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;}
  .pi{border:2px solid var(--line);border-radius:8px;padding:2px 10px;background:#f9fbfe;cursor:pointer;transition:.12s;}
  .pi b{color:var(--muted);font-weight:400;}
  .pi:hover{border-color:var(--accent);background:var(--accent-soft);}

  /* таблица плана */
  .tw{flex:1 1 auto;min-height:0;overflow:hidden;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th{font-size:18px;font-weight:600;color:var(--muted);text-align:left;padding:2px 8px;border-bottom:2px solid var(--line);}
  th.n,td.n{text-align:center;width:112px;}
  th.i,td.i{width:34px;text-align:center;color:var(--muted);}
  td{padding:2px 8px;border-bottom:1px solid #eef2f8;cursor:pointer;transition:.12s;vertical-align:top;}
  tr.row:hover td{background:var(--accent-soft);}
  tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none;background:#f7faff;}
  tr.pickbad td{background:var(--bad-soft)!important;box-shadow:inset 3px 0 0 var(--bad);}
  tr.pickok td{background:var(--ok-soft)!important;box-shadow:inset 3px 0 0 var(--ok);}
  tr.locked td{cursor:default;}
  .pi.pickbad{border-color:var(--bad);background:var(--bad-soft);}
  .pi.pickok{border-color:var(--ok);background:var(--ok-soft);}
  .miss{border:2px dashed var(--warn);background:var(--warn-soft);color:#7a5a12;border-radius:9px;
        padding:3px 11px;cursor:pointer;text-align:left;flex:0 0 auto;transition:.12s;}
  .miss:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .miss.pickbad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:#8f1d1d;}
  .miss.pickok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:#0c5c41;}
  .errline{flex:0 0 auto;border:2px solid var(--ok);background:var(--ok-soft);border-radius:11px;padding:7px 13px;
           display:flex;flex-direction:column;gap:2px;}
  .errline .lbl{color:#0c5c41;font-weight:600;}
  .errline .val{color:var(--ink);}
  .errline .num{color:var(--muted);}
  [disabled]{cursor:default;}

  /* варианты исправления */
  .fixes{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;}
  .fx{border:2px solid var(--line);border-radius:10px;background:#fff;padding:4px 11px;cursor:pointer;
      text-align:left;display:flex;gap:8px;align-items:flex-start;transition:.12s;}
  .fx kbd{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--line);color:#fff;
          display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:700;}
  .fx:hover{border-color:var(--accent);background:var(--accent-soft);}
  .fx.right{border-color:var(--ok);background:var(--ok-soft);} .fx.right kbd{background:var(--ok);}
  .fx.wrong{border-color:var(--bad);background:var(--bad-soft);} .fx.wrong kbd{background:var(--bad);}

  .fb{border-radius:9px;padding:5px 11px;min-height:34px;display:flex;align-items:center;flex:0 0 auto;}
  .fb.idle{background:#f2f6fc;color:var(--muted);border:1px dashed var(--line);}
  .fb.ok{background:var(--ok-soft);color:#0c5c41;border:1px solid var(--ok);}
  .fb.no{background:var(--bad-soft);color:#8f1d1d;border:1px solid var(--bad);}

  #done{display:none;flex:1 1 auto;min-height:0;gap:16px;align-items:center;justify-content:center;}
  #done.on{display:flex;}
  .ring{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .ring svg{width:162px;height:162px;}
  .ring .verdict{font-size:20px;font-weight:600;}
  .bars{flex:0 1 540px;display:flex;flex-direction:column;gap:6px;}
  .bar{background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 11px;}
  .bar .row{display:flex;justify-content:space-between;margin-bottom:3px;}
  .track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
  .track i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s;}

  footer{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:2px solid var(--line);margin-top:8px;flex:0 0 auto;}
  .nav{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;
       padding:6px 16px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .nav.ghost{background:#fff;color:var(--accent);}
  .nav[disabled]{opacity:.4;cursor:default;}
  .foot{margin-left:auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #resizer{position:absolute;right:0;bottom:0;width:23px;height:23px;cursor:nwse-resize;z-index:30;
    background:linear-gradient(135deg,transparent 42%,var(--accent) 42%,var(--accent) 54%,transparent 54%,
               transparent 66%,var(--accent) 66%,var(--accent) 78%,transparent 78%);}
  #sizetag{position:absolute;right:27px;bottom:3px;z-index:30;background:rgba(15,27,45,.8);color:#fff;
    border-radius:6px;padding:1px 8px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #sizetag.show{opacity:1;}
</style>

<div id="host">
  <div id="stage">
    <header>
      <div class="logo">В</div>
      <div class="hg"><div class="h">Актуализация учебного плана: программа «В»</div></div>

        </tr></thead><tbody id="tb"></tbody></table></div>
        <button class="miss" id="miss"></button>
        <div class="errline" id="errline" style="display:none"></div>

      </div>

    </main>

    <div id="done">
      <div class="ring">

                  stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"></circle>

        <div class="verdict" id="verdict"></div>
      </div>
      <div class="bars">
        <div class="bar"><div class="row"><span>Найдено ошибок в планах</span><b id="rA">0 / 6</b></div><div class="track"><i id="fA"></i></div></div>

        <div class="bar" style="border-color:#c2410c;background:#f7faff;">
          <div class="row"><span class="sub">Итог аудита</span><b class="sub" id="rAll" style="color:#c2410c;">0 / 12</b></div>
          <div id="advice" style="color:#5b6c88;"></div>
        </div>
      </div>
    </div>

    <footer>
      <button class="nav ghost" id="btnPrev">← Назад</button>
      <button class="nav" id="btnNext">Далее →</button>
      <button class="nav ghost" id="btnReset">Заново ⟲</button>
      <div class="foot" id="foot"></div>
    </footer>
  </div>
  <div id="sizetag"></div>
  <div id="resizer" title="Потяните, чтобы изменить размер"></div>
</div>

<script>
const BASE_W = 1040, BASE_H = 566;
const host=document.getElementById('host'),stage=document.getElementById('stage'),sizetag=document.getElementById('sizetag');
function fit(){
  const w=host.clientWidth,h=host.clientHeight,k=Math.min(1,w/BASE_W,h/BASE_H);
  const sw=w/k,sh=Math.min(h/k,900);
  stage.style.width=sw+'px';stage.style.height=sh+'px';
  stage.style.transform='scale('+k+') translateY('+((h/k-sh)/2)+'px)';
}
new ResizeObserver(fit).observe(host);addEventListener('resize',fit);
(function(){const rz=document.getElementById('resizer');let d=false,sx=0,sy=0,sw=0,sh=0,t=null;
  const show=()=>{sizetag.textContent=Math.round(host.clientWidth)+' × '+Math.round(host.clientHeight)+' px';
    sizetag.classList.add('show');clearTimeout(t);t=setTimeout(()=>sizetag.classList.remove('show'),1100);};
  const st=e=>{d=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;sw=host.clientWidth;sh=host.clientHeight;
    document.body.style.userSelect='none';e.preventDefault();};
  const mv=e=>{if(!d)return;const p=e.touches?e.touches[0]:e;
    host.style.width=Math.max(340,Math.min(innerWidth,sw+p.clientX-sx))+'px';
    host.style.height=Math.max(220,Math.min(600,sh+p.clientY-sy))+'px';fit();show();e.preventDefault();};
  const en=()=>{d=false;document.body.style.userSelect='';};
  rz.addEventListener('mousedown',st);rz.addEventListener('touchstart',st,{passive:false});
  addEventListener('mousemove',mv);addEventListener('touchmove',mv,{passive:false});
  addEventListener('mouseup',en);addEventListener('touchend',en);
  rz.addEventListener('dblclick',()=>{host.style.width='100vw';host.style.height='600px';fit();show();});
})();

const LET=['А','Б','В','Г'];
const $=id=>document.getElementById(id);
const shuf=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const FORD=CASES.map(c=>shuf(c.fixes.length));

let i=0,fin=false;
let st=CASES.map(()=>({found:null,fixed:null,pickEl:null,pickFix:null}));
const N=CASES.length;
const scoreA=()=>st.filter(s=>s.found===true).length;
const scoreB=()=>st.filter(s=>s.fixed===true).length;
const total=()=>scoreA()+scoreB();

function render(){
  if(fin){renderDone();return;}
  $('done').classList.remove('on');$('area').style.display='flex';
  const c=CASES[i],s=st[i],locked=s.found!==null;
  $('meta').innerHTML='<span class="chip">Аудит плана</span> Ситуация '+(i+1)+' из '+N+' · '+c.who;
  $('ask').textContent = locked ? 'Шаг 2. Выберите верное решение.' : 'Шаг 1. Найдите в учебном плане одну ошибку — кликните по ней.';

  // на шаге 2 таблицу сворачиваем в компактную плашку
  $('tw').style.display   = locked ? 'none' : '';
  $('pass').style.display = locked ? 'none' : 'flex';
  $('miss').style.display = locked ? 'none' : '';
  $('errline').style.display = locked ? 'flex' : 'none';
  if(locked){
    const e=$('errline');
    e.innerHTML='<div class="lbl">Ошибка в плане: '+c.badName+'</div>'+
                '<div class="val">'+c.badText+'</div>'+
                (c.badNums?'<div class="num">'+c.badNums+'</div>':'');
  }

  // паспорт
  const pass=$('pass');pass.innerHTML='';
  c.pass.forEach((p,k)=>{
    const id='p'+k;
    const d=document.createElement('div');d.className='pi';
    d.innerHTML='<b>'+p.k+':</b> '+p.v;
    mark(d,id,s,c);
    if(!locked) d.onclick=()=>pick(id);
    pass.appendChild(d);
  });

  // строки плана
  const tb=$('tb');tb.innerHTML='';
  c.rows.forEach((r,k)=>{
    const id='r'+k;
    const tr=document.createElement('tr');tr.className='row';
    tr.innerHTML='<td class="i">'+(k+1)+'</td><td>'+r.t+'</td><td class="n">'+r.a+'</td><td class="n">'+r.th+'</td><td class="n">'+r.pr+'</td>';
    mark(tr,id,s,c);
    if(!locked) tr.onclick=()=>pick(id); else tr.classList.add('locked');
    tb.appendChild(tr);
  });
  const tr=document.createElement('tr');tr.className='row tot';
  tr.innerHTML='<td class="i"></td><td>'+c.total.t+'</td><td class="n">'+c.total.a+'</td><td class="n">'+c.total.th+'</td><td class="n">'+c.total.pr+'</td>';
  mark(tr,'tot',s,c);
  if(!locked) tr.onclick=()=>pick('tot'); else tr.classList.add('locked');
  tb.appendChild(tr);

  const mb=$('miss');mb.textContent='⚠ '+c.missLabel;
  mb.className='miss';mark(mb,'miss',s,c);mb.disabled=locked;
  if(!locked) mb.onclick=()=>pick('miss');

  // шаг 2
  const fx=$('fixes');fx.innerHTML='';
  if(locked){
    FORD[i].forEach((fi,pos)=>{
      const b=document.createElement('button');b.className='fx';
      b.innerHTML='<kbd>'+LET[pos]+'</kbd><span>'+c.fixes[fi]+'</span>';
      if(s.fixed!==null){b.disabled=true;
        if(fi===c.fixC)b.classList.add('right');
        else if(s.pickFix===fi)b.classList.add('wrong');
      } else b.onclick=()=>{s.pickFix=fi;s.fixed=(fi===c.fixC);render();};
      fx.appendChild(b);
    });
  }

  const fb=$('fb');
  if(s.fixed!==null){
    fb.className='fb '+(s.fixed?'ok':'no');
    fb.textContent=(s.fixed?'✓ ':'✗ ')+c.why;
  } else if(locked){
    fb.className='fb '+(s.found?'ok':'no');
    fb.textContent=(s.found?'✓ Ошибка найдена верно. ':'✗ Ошибка не здесь — она отмечена зелёным. ')+c.spot;
  } else {
    fb.className='fb idle';
    fb.textContent=c.hint;
  }
  $('pbar').style.width=(st.filter(x=>x.fixed!==null).length/N*100)+'%';
  sync();
}
function mark(el,id,s,c){
  if(s.found===null)return;
  if(id===c.bad)el.classList.add('pickok');
  else if(id===s.pickEl)el.classList.add('pickbad');
}
function pick(id){
  const s=st[i],c=CASES[i];
  s.pickEl=id;s.found=(id===c.bad);render();
}
function renderDone(){
  $('area').style.display='none';$('done').classList.add('on');
  const a=scoreA(),b=scoreB(),all=a+b,pct=Math.round(all/(N*2)*100);
  $('rA').textContent=a+' / '+N;$('fA').style.width=(a/N*100)+'%';
  $('rB').textContent=b+' / '+N;$('fB').style.width=(b/N*100)+'%';
  $('rAll').textContent=all+' / '+(N*2);
  $('ringFill').style.strokeDashoffset=326.7*(1-pct/100);
  $('ringFill').setAttribute('stroke',pct>=85?'#0f8a5f':pct>=70?'#c2410c':'#c62828');
  $('ringTxt').textContent=pct+'%';
  $('verdict').textContent=pct>=85?'Отлично — план аудируете уверенно':pct>=70?'Зачёт — есть пробелы':'Незачёт — нужно повторить';
  $('advice').textContent=pct>=85?'План по программе «В» готов к утверждению.':pct>=70?'Проходной балл набран. Разберите ситуации с ошибками.':'Проходной результат — 70 %. Пройдите аудит повторно.';
  $('pbar').style.width='100%';sync();
}
function sync(){
  $('scoreVal').textContent=total()+' / '+(N*2);
  $('btnPrev').disabled=fin?false:(i===0);
  const ready=!fin&&st[i].fixed!==null;
  $('btnNext').disabled=fin?true:!ready;
  $('btnNext').textContent=fin?'Готово':(i===N-1?'Итог аудита →':'Далее →');
  $('foot').textContent=fin?'Программа «В» · работы повышенной опасности':'Разобрано: '+st.filter(x=>x.fixed!==null).length+' из '+N+' · Программа «В» · работы повышенной опасности';
}
$('btnNext').onclick=()=>{if(fin)return;if(i===N-1){fin=true;renderDone();}else{i++;render();}};
$('btnPrev').onclick=()=>{if(fin){fin=false;i=N-1;}else if(i>0)i--;render();};
$('btnReset').onclick=()=>{i=0;fin=false;st=CASES.map(()=>({found:null,fixed:null,pickEl:null,pickFix:null}));render();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!$('btnNext').disabled)$('btnNext').click();
  if(e.key==='ArrowLeft'&&!$('btnPrev').disabled)$('btnPrev').click();});
fit();render();
</script>
