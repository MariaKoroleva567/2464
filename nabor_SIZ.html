<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Минимальный набор СИЗ для обучения (766н / 767н)</title>
<style>
  :root{
    --navy:#143c66; --ink:#1c2733; --muted:#5b6b7c; --green:#0f6b3a;
    --line:#dbe4ee; --bg:#eef1f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
    overflow:hidden; /* без скроллов */
  }
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* Панель управления */
  .controls{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:nowrap}
  .brand{font-weight:700;color:var(--navy);font-size:13px;line-height:1.15;white-space:nowrap}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:10px}
  .resizer{display:flex;align-items:center;gap:8px;margin-left:auto;background:#f3f6fa;border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .resizer label{font-size:11px;color:var(--muted);white-space:nowrap}
  .resizer input[type=range]{width:clamp(70px,14vw,150px);accent-color:var(--navy)}
  #zoomVal{font-size:11px;font-weight:600;color:var(--navy);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .btn-fit{border:1px solid var(--line);background:#fff;color:var(--navy);font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .btn-fit:hover{background:#eef3f9}
  .btn-fit.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .counter{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* Сцена: слайд fluid — ширина 100vw, высота <= 600px и <= высоты окна */
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scalebox{transform-origin:center center;transition:transform .12s ease;line-height:0}
  .slide{
    width:100vw;
    height:min(600px, calc(100vh - 110px));
    height:min(600px, calc(100dvh - 110px));
    min-height:220px;
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px rgba(20,40,60,.18);
  }
  .slide.anim{animation:fadeIn .28s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slide>*{height:100%}

  /* --- Титульный слайд --- */
  .t-title{display:flex;flex-direction:column;padding:clamp(16px,2.2vw,42px) clamp(22px,3vw,56px);color:#fff;
    background:linear-gradient(135deg,#0e2039 0%,#143c66 55%,#1b5a8f 100%)}
  .t-kicker{text-transform:uppercase;letter-spacing:2px;font-size:clamp(9px,.85vw,14px);color:#9fc3e8}
  .t-title h1{font-size:clamp(23px,3.5vw,60px);line-height:1.08;margin:10px 0 10px;font-weight:800}
  .t-sub{font-size:clamp(12px,1.25vw,20px);color:#d3e3f4;line-height:1.5;max-width:min(95%,1000px)}
  .t-docs{display:flex;gap:clamp(8px,1vw,16px);margin:clamp(10px,1.4vw,22px) 0}
  .t-doc{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:clamp(8px,1vw,16px) clamp(10px,1.2vw,18px)}
  .t-doc b{color:#ffd76a;font-size:clamp(10px,.95vw,14px);display:block;margin-bottom:4px}
  .t-doc p{font-size:clamp(10.5px,1.02vw,16px);color:#e2edf9;line-height:1.4}
  .t-thumbs{display:flex;gap:clamp(3px,.45vw,6px);margin-top:auto;justify-content:center}
  .t-thumbs img{width:clamp(30px,3.2vw,100px);aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.30)}

  /* --- Слайд-позиция --- */
  .item{display:flex}
  .item .pic{flex:0 0 46%;display:flex;align-items:center;justify-content:center;padding:clamp(10px,1.4vw,24px);border-right:1px solid var(--line);background:#fff}
  .item .pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .item .txt{flex:1;min-width:0;padding:clamp(12px,1.7vw,28px) clamp(14px,2vw,34px);display:flex;flex-direction:column;gap:clamp(5px,.75vw,12px)}
  .chip{align-self:flex-start;background:#e8eef5;color:var(--navy);font-size:clamp(9px,.9vw,14px);text-transform:uppercase;letter-spacing:.5px;padding:3px 12px;border-radius:999px;white-space:nowrap}
  .item h2{font-size:clamp(19px,2.5vw,42px);color:var(--navy);line-height:1.12}
  .blk{font-size:clamp(12.5px,1.35vw,21px);line-height:1.42;color:#33465a}
  .blk .lab{display:block;font-size:clamp(9px,.8vw,13px);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:1px}
  .basis{color:var(--green);font-weight:600}
  .skill{background:#f0f7f2;border-left:3px solid var(--green);padding:clamp(7px,.9vw,14px) clamp(10px,1.2vw,16px);border-radius:0 8px 8px 0;font-size:clamp(12.5px,1.35vw,21px);line-height:1.42;color:#2a3c50}
  .item .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(9.5px,.9vw,14px);color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .item .foot .num{font-weight:700;color:var(--navy);white-space:nowrap}
  .item .foot .ref{font-size:clamp(8.5px,.8vw,12px);text-align:right}

  /* --- Финальный слайд --- */
  .t-final{display:flex;flex-direction:column;padding:clamp(18px,2.4vw,46px) clamp(24px,3.2vw,60px);color:#fff;
    background:linear-gradient(135deg,#0e2039 0%,#143c66 55%,#1b5a8f 100%)}
  .t-final h2{font-size:clamp(24px,3.2vw,54px);font-weight:800;line-height:1.1}
  .t-final .sub{color:#d3e3f4;font-size:clamp(12px,1.25vw,19px);margin:6px 0 clamp(12px,1.6vw,24px)}
  .recap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,.7vw,12px)}
  .recap .cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:clamp(7px,.9vw,14px) clamp(10px,1.1vw,16px)}
  .recap .cell b{display:block;font-size:clamp(12px,1.2vw,19px);margin-bottom:2px}
  .recap .cell span{font-size:clamp(9.5px,.95vw,15px);color:#e2edf9;line-height:1.3;display:block}
  .t-final .note{font-size:clamp(11px,1.05vw,16px);color:#bcd3ea;line-height:1.45;max-width:min(100%,1100px);margin-top:clamp(10px,1.4vw,22px)}
  .t-final .thanks{margin-top:auto;font-size:clamp(14px,1.5vw,22px);color:#ffd76a;font-weight:600}

  /* --- Навигация --- */
  .nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 10px;background:#fff;border-top:1px solid var(--line)}
  .nav button.arrow{width:40px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;color:var(--navy);cursor:pointer;flex:none}
  .nav button.arrow:hover{background:#eef3f9}
  .hint{font-size:10px;color:#9aa7b6;white-space:nowrap}
  .dots{display:flex;gap:5px;max-width:40vw;overflow:hidden}
  .dot{width:8px;height:8px;border-radius:50%;background:#c6d2e0;border:none;cursor:pointer;padding:0;flex:none}
  .dot.active{background:var(--navy);transform:scale(1.25)}
  @media (max-width:720px){ .hint{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="controls">
    <div class="brand">СИЗ для обучения<small>Приказы Минтруда № 766н, № 767н</small></div>
    <div class="resizer" title="Ресайзер: 100% = точно в размер окна (слайд не выходит за кадр)">
      <label>Масштаб</label>
      <input type="range" id="zoom" min="50" max="100" step="5" value="100">
      <span id="zoomVal">100%</span>
      <button class="btn-fit active" id="fitBtn" type="button">Авто</button>
    </div>
    <div class="counter" id="counter">1 / 15</div>
  </header>

  <main class="stage" id="stage">
    <div class="scalebox" id="scalebox">
      <div class="slide" id="slide"></div>
    </div>
  </main>

  <footer class="nav">
    <button class="arrow" id="prev" type="button" title="Предыдущий">←</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" type="button" title="Следующий">→</button>
    <span class="hint">← → / пробел / точки внизу</span>
  </footer>
</div>

/* ---------- ресайзер ---------- */
const scalebox = document.getElementById('scalebox');
const slideEl = document.getElementById('slide');
const zoomInput = document.getElementById('zoom');
const zoomVal = document.getElementById('zoomVal');
const fitBtn = document.getElementById('fitBtn');

function applyZoom(){
  const z = zoomInput.value / 100;
  scalebox.style.transform = 'scale(' + z + ')';
  zoomVal.textContent = Math.round(z * 100) + '%';
  fitBtn.classList.toggle('active', z >= 0.995);
}
zoomInput.addEventListener('input', applyZoom);
fitBtn.addEventListener('click', function(){ zoomInput.value = 100; applyZoom(); });

/* ---------- рендер слайдов ---------- */
function renderTitle(){
  const thumbs = ITEMS.map(function(it){
    return '<img src="' + IMGS[it.key] + '" alt="">';
  }).join('');
  return '<div class="t-title">' +
    '<div class="t-kicker">Охрана труда · Учебная лекция</div>' +
    '<h1>Минимальный набор СИЗ<br>для обучения сотрудников</h1>' +
    '<p class="t-sub">СИЗ, применение которых требует практических навыков и демонстрации правильного использования. Изображения самих изделий — для слайдов и методических материалов.</p>' +
    '<div class="t-docs">' +
      '<div class="t-doc"><b>Приказ № 766н (Правила)</b><p>Работодатель обязан проводить «обучение, инструктаж … о правилах эксплуатации СИЗ, использование которых требует практических навыков», и контролировать правильность их применения (п. 10, 12).</p></div>' +
      '<div class="t-doc"><b>Приказ № 767н (Единые типовые нормы)</b><p>Номенклатура СИЗ по идентифицированным опасностям (приложение 2). Именно из этих разделов взят набор для лекции.</p></div>' +
    '</div>' +
    '<div class="t-thumbs">' + thumbs + '</div>' +
  '</div>';
}

function renderItem(it, idx){
  return '<div class="item">' +
    '<div class="pic"><img src="' + IMGS[it.key] + '" alt="' + it.title + '"></div>' +
    '<div class="txt">' +
      '<span class="chip">' + it.group + '</span>' +
      '<h2>' + it.title + '</h2>' +
      '<div class="blk basis"><span class="lab">Основание</span>' + it.basis + '</div>' +
      '<div class="blk"><span class="lab">Состав комплекта</span>' + it.comp + '</div>' +
      '<div class="skill"><b>Что показывают на обучении:</b> ' + it.skills + '</div>' +
      '<div class="foot"><span class="num">СИЗ ' + (idx+1) + ' / 13</span><span class="ref">Минтруд РФ · 29.10.2021 № 766н, № 767н</span></div>' +
    '</div>' +
  '</div>';
}

function renderFinal(){
  const groups = {};
  ITEMS.forEach(function(it){ groups[it.group] = (groups[it.group]||0) + 1; });
  const cells = Object.keys(groups).map(function(g){
    return '<div class="cell"><b>' + g + '</b><span>' + groups[g] + ' поз. — разд. прил. 2 к № 767н</span></div>';
  }).join('');
  return '<div class="t-final">' +
    '<h2>Итого в наборе — 13 СИЗ</h2>' +
    '<p class="sub">Все позиции взяты из Единых типовых норм (приказ № 767н) и требуют обучения с демонстрацией.</p>' +
    '<div class="recap">' + cells + '</div>' +
    '<p class="note"><b>Приказ № 766н:</b> перед началом работы работник осматривает и оценивает исправность, комплектность и пригодность СИЗ; работодатель проводит обучение и инструктаж о правилах эксплуатации СИЗ, требующих практических навыков.</p>' +
    '<div class="thanks">Спасибо за внимание!</div>' +
  '</div>';
}

const slides = [];
slides.push({ render: function(){ return renderTitle(); } });
ITEMS.forEach(function(it, i){ slides.push({ render: function(){ return renderItem(it, i); } }); });
slides.push({ render: function(){ return renderFinal(); } });

/* ---------- навигация ---------- */
let idx = 0;
const counter = document.getElementById('counter');
const dotsBox = document.getElementById('dots');

function buildDots(){
  dotsBox.innerHTML = '';
  slides.forEach(function(_, i){
    const d = document.createElement('button');
    d.className = 'dot'; d.type = 'button'; d.title = 'Слайд ' + (i+1);
    d.addEventListener('click', function(){ show(i); });
    dotsBox.appendChild(d);
  });
}

function show(i){
  idx = ((i % slides.length) + slides.length) % slides.length;
  slideEl.classList.remove('anim');
  void slideEl.offsetWidth;
  slideEl.classList.add('anim');
  slideEl.innerHTML = slides[idx].render();
  counter.textContent = (idx + 1) + ' / ' + slides.length;
  Array.prototype.forEach.call(dotsBox.children, function(d, k){ d.classList.toggle('active', k === idx); });
}

document.getElementById('prev').addEventListener('click', function(){ show(idx - 1); });
document.getElementById('next').addEventListener('click', function(){ show(idx + 1); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft' || e.key === 'PageUp')  { show(idx - 1); }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(idx + 1); }
  if (e.key === 'Home') { show(0); }
  if (e.key === 'End')  { show(slides.length - 1); }
});

buildDots();
show(0);
applyZoom();
</script>
